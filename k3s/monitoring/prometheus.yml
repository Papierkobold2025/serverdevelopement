apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus
              mountPath: /srv/prometheus/prometheus.yml
              subPath: prometheus.yml
          image: prom/prometheus
          args:
            - "--config.file=/srv/prometheus/prometheus.yml"
      volumes:
        - name: prometheus
          configMap:
            name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: NodePort
