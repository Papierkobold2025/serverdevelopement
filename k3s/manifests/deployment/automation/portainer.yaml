apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      containers:
        - name: portainer
          image: portainer/portainer-ce:lts
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: portainer-data
              mountPath: /data
      volumes:
        - name: portainer-data
          hostPath:
            path: /srv/portainer/data
---
apiVersion: v1
kind: Service
metadata:
  name: portainer-svc
  namespace: automation
spec:
  selector:
    app: portainer
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 31636
  type: NodePort
